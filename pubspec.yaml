name: sefer
description: "A private, offline-first reader for learning languages."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  phosphoricons_flutter: ^1.0.0
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-nunito.txt
    - assets/fonts/OFL-literata.txt
    - assets/fonts/OFL-notoserif.txt
    - assets/fonts/OFL-atkinsonhyperlegible.txt
    - assets/fonts/OFL-notosanshebrew.txt
    - assets/fonts/OFL-frankruhllibre.txt
    - assets/fonts/OFL-notonaskharabic.txt
    - assets/fonts/OFL-amiri.txt
    - assets/fonts/OFL-lexend.txt
    - assets/fonts/OFL-andika.txt
    - assets/fonts/OFL-opendyslexic.txt
    - assets/fonts/OFL-heebo.txt
    - assets/fonts/OFL-varelaround.txt
    - assets/fonts/OFL-rubik.txt
    - assets/fonts/OFL-vazirmatn.txt
    - assets/fonts/OFL-notosansarabic.txt
    - assets/fonts/OFL-baloobhaijaan2.txt

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-500.ttf
          weight: 500
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
        - asset: assets/fonts/Nunito-900.ttf
          weight: 900
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-400.ttf
          weight: 400
        - asset: assets/fonts/Literata-700.ttf
          weight: 700
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSerif-700.ttf
          weight: 700
    - family: Atkinson
      fonts:
        - asset: assets/fonts/Atkinson-400.ttf
          weight: 400
        - asset: assets/fonts/Atkinson-700.ttf
          weight: 700
    - family: NotoSansHebrew
      fonts:
        - asset: assets/fonts/NotoSansHebrew-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansHebrew-700.ttf
          weight: 700
    - family: FrankRuhl
      fonts:
        - asset: assets/fonts/FrankRuhl-400.ttf
          weight: 400
        - asset: assets/fonts/FrankRuhl-700.ttf
          weight: 700
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-400.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabic-700.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-400.ttf
          weight: 400
        - asset: assets/fonts/Amiri-700.ttf
          weight: 700
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-400.ttf
          weight: 400
        - asset: assets/fonts/Lexend-700.ttf
          weight: 700
    - family: Andika
      fonts:
        - asset: assets/fonts/Andika-400.ttf
          weight: 400
        - asset: assets/fonts/Andika-700.ttf
          weight: 700
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-400.otf
          weight: 400
        - asset: assets/fonts/OpenDyslexic-700.otf
          weight: 700
    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo-400.ttf
          weight: 400
        - asset: assets/fonts/Heebo-700.ttf
          weight: 700
    - family: VarelaRound
      fonts:
        - asset: assets/fonts/VarelaRound-400.ttf
          weight: 400
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-400.ttf
          weight: 400
        - asset: assets/fonts/Rubik-700.ttf
          weight: 700
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-400.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-700.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-700.ttf
          weight: 700
    - family: BalooBhaijaan
      fonts:
        - asset: assets/fonts/BalooBhaijaan-400.ttf
          weight: 400
        - asset: assets/fonts/BalooBhaijaan-700.ttf
          weight: 700
